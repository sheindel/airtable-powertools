# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git describe
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Build CSS and TypeScript
        run: npm run build
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies for PyScript config generation
        run: pip install tomli tomli-w
      
      - name: Generate PyScript configuration
        run: python scripts/generate_pyscript_config.py
      
      - name: Inject version into HTML
        run: |
          # Generate date-based version with build index (YYYY.MM.DD.HHMM format)
          DATE_VERSION=$(date -u +%Y.%m.%d)
          BUILD_INDEX=$(date -u +%H%M)
          FULL_VERSION="${DATE_VERSION}.${BUILD_INDEX}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Check if this is a tagged release
          if git describe --exact-match --tags HEAD 2>/dev/null; then
            DISPLAY_VERSION="v${DATE_VERSION}"
            TOOLTIP="Version ${FULL_VERSION} | Built: ${BUILD_TIME}"
          else
            DISPLAY_VERSION="v${DATE_VERSION}"
            # Escape special characters in commit message for sed
            COMMIT_MSG_ESCAPED=$(echo "${COMMIT_MSG}" | sed 's/[&/\|]/\\&/g')
            TOOLTIP="Version ${FULL_VERSION} | Commit: ${COMMIT_SHA} | Built: ${BUILD_TIME} | ${COMMIT_MSG_ESCAPED}"
          fi
          
          echo "Deploying version: ${FULL_VERSION} (${COMMIT_SHA})"
          
          # Escape special characters in tooltip for sed
          TOOLTIP_ESCAPED=$(echo "${TOOLTIP}" | sed 's/[&/\|]/\\&/g')
          
          # Replace version in index.html with tooltip
          sed -i "s|<span id=\"app-version\"[^>]*>v[0-9.-]*</span>|<span id=\"app-version\" title=\"${TOOLTIP_ESCAPED}\" class=\"cursor-help\">${DISPLAY_VERSION}</span>|g" web/index.html
          sed -i "s|<span id=\"setup-app-version\"[^>]*>v[0-9.-]*</span>|<span id=\"setup-app-version\" title=\"${TOOLTIP_ESCAPED}\">${DISPLAY_VERSION}</span>|g" web/index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
